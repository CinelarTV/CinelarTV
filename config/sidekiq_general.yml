# frozen_string_literal: true

# Sidekiq configuration for general workers that handle everything EXCEPT video transcoding
# These workers process subscriptions, default, and xmltv jobs
# Use this when you want dedicated workers for non-video tasks
# Video transcoding should be handled by separate video-only workers

:queues:
  - [subscriptions, 5]
  - [default, 3]
  - [xmltv, 2]

:concurrency: 25
:pidfile: tmp/pids/sidekiq_general.pid
:logfile: log/sidekiq_general.log
